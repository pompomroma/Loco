name: Deploy to Vercel

on:
  push:
    branches:
      - claude/vibe-ai-file-handling-0opc9j
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Vercel token
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel auto-deploy is not set up yet. Create a token at vercel.com/account/settings/tokens and add it as the VERCEL_TOKEN repository secret (Settings -> Secrets and variables -> Actions). The next run will create the Vercel project automatically and print your permanent URL."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (production)
        if: steps.gate.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Optional. When set (with VERCEL_PROJECT_ID), skips auto-linking.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            # First run: create/link the Vercel project under the token's
            # account (project name derives from the repo directory: "loco").
            unset VERCEL_ORG_ID VERCEL_PROJECT_ID
            vercel link --yes --token="$VERCEL_TOKEN"
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "PERMANENT URL: $URL"
          {
            echo "## Your permanent Loco link"
            echo ""
            echo "**$URL**"
            echo ""
            echo "This URL stays up independent of any Codespace. Production"
            echo "alias domains (\"<project>.vercel.app\") are listed in the"
            echo "Vercel dashboard under the project's Domains tab."
          } >> "$GITHUB_STEP_SUMMARY"
